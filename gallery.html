<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>گالری تصاویر | طالبی اتوموتیو</title>
  <meta name="description" content="تصاویر واقعی خودروهای موجود و فروخته‌شده نمایشگاه امیر طالبی.">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="icon" href="assets/images/brand/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("talebi-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Readex+Pro:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="gallery">

<main>
  <section class="phero" style="height:545px">
    <div class="bgimg"><img id="ph-img" alt=""></div>
    <div class="g1"></div><div class="g2"></div><div class="fadeb"></div>
    <div class="ghost" aria-hidden="true"><span>کلاسیک</span><span>اصیل</span></div>
    <div class="inner">
      <nav class="crumbs" aria-label="مسیر"><a href="index.html">خانه</a><span class="sep"></span><span class="cur">گالری</span></nav>
      <h1 style="font-size:72px;line-height:80px"><span>گالری</span><span>تصاویر</span></h1>
      <p class="count">عکس‌های واقعی خودروهای نمایشگاه</p>
    </div>
  </section>

  <section class="wrap" style="padding-inline:48px;padding-bottom:96px">
    <div class="gpanel">
      <div class="seg" id="gseg"><span class="thumb"></span><button type="button" data-s="all">همه</button><button type="button" data-s="available">موجود</button><button type="button" data-s="sold">فروخته‌شده</button></div>
      <label class="search-in"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" type="search" placeholder="جستجو در گالری…" aria-label="جستجو در گالری"></label>
      <span class="n" id="gcount"></span>
    </div>
    <div class="gsec">
      <div class="eyebrow">مجموعه</div>
      <h2 class="h-mono">تصاویر خودروها</h2>
      <div class="ggrid" id="ggrid"></div>
    </div>
  </section>
</main>

<script src="data/vehicles.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
